name: Publish to PyPI

# Auto-publish on version tags. Requires a Trusted Publisher to be configured
# on the PyPI project (see README.md "Releasing" section).
on:
  push:
    tags:
      - "v*"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write     # required for PyPI Trusted Publishers (OIDC)
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # No `password:` — auth is OIDC via the project's Trusted Publisher.
